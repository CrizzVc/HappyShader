screen.CEL_SHADING_MENU=CEL_SHADING CEL_BANDS CEL_SHADOW_BRIGHTNESS CEL_TORCH_STEPS WARM_LIGHTING

# Submenu: Waving Animations
screen.WAVING_MENU=WAVING_FOLIAGE WAVING_LEAVES WAVING_SPEED WAVING_INTENSITY

# Submenu: Cartoon Water
screen.WATER_MENU=CARTOON_WATER WATER_WAVE_DISPLACEMENT WATER_RIPPLES WATER_STYLE WATER_TRANSPARENCY

# Submenu: Dynamic Shadows
screen.SHADOW_MENU=DYNAMIC_SHADOWS SHADOW_MAP_RESOLUTION SHADOW_QUALITY SHADOW_DISTANCE SHADOW_BIAS SHADOW_DISTORTION SHADOW_DARKNESS
